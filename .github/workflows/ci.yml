# 検証専用のCI。型検査・ビルド・画面遷移のスモークテストを実行する。
# 配信は行わない（配信は .github/workflows/deploy.yml が担う）。役割の衝突を避けるため
# 名前と同時実行制御群を配信CI（deploy-cloudflare-pages）と分ける。
name: Verify

on:
  push:
  pull_request:

# 同一参照の古い検証実行は新しい実行で打ち切る。配信の制御群とは別にする。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Typecheck, build, smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        # Node 24 系でビルドが異常終了する既知の問題があるため、配信CIと同じく .nvmrc に固定する。
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Show toolchain versions
        run: node -v && npm -v
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (engine pure logic)
        # 固定時間刻みのフレーム数非依存・時計の単調化と再同期・タブ復帰の時刻一致など、
        # Issue #3 の受け入れ基準を決定的に保証する単体テスト。
        run: npm run test
      - name: Build production bundle (index.html only)
        # 本番配信と同じ index.html のみのビルドが通ることを確認する。
        # 本番と同じくトークンを注入し、検証が本番のトークン注入経路と一致するようにする。
        run: npm run build:app
        env:
          TEXT_ALIVE_API_TOKEN: ${{ secrets.TEXT_ALIVE_API_TOKEN }}
      - name: Assert diagnostics pages are excluded from production bundle
        # 診断ページは規約適合のため本番配信に含めてはならない（Issue #47、docs/decisions/architecture.md §7.2）。
        # 本番ビルド成果物に入力診断ページ input.html と層合成診断ページ layer-composite.html が無いことを、
        # 後続の検証用ビルドが全ページを出す前に確認する。
        run: test ! -f dist/input.html && test ! -f dist/layer-composite.html && test ! -f dist/butterfly.html && test ! -f dist/spatial.html && test ! -f dist/center-figure.html && test ! -f dist/audio.html
      - name: Build verification bundle (all pages)
        # 既定ビルド。最終的な dist は本体に加え解析・性能・文字診断・雨診断・カメラ軌跡診断・発光点診断の
        # 各ページを含み、後続の preview の配信対象となる。この成果物を後続のスモークが配信するため、本番と同じトークンを注入する。
        run: npm run build
        env:
          TEXT_ALIVE_API_TOKEN: ${{ secrets.TEXT_ALIVE_API_TOKEN }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          echo "started preview server (pid $!)"
      - name: Run screen-transition smoke test
        run: BASE=http://127.0.0.1:4173 npm run smoke
      - name: Run engine-loop smoke test
        # 配信ビルドで診断アクセサが公開され、ゲーム時刻が後退せず超過が生じないことの実ブラウザ補助確認。
        run: BASE=http://127.0.0.1:4173 node scripts/engine-loop-smoke.mjs
      - name: Run rendering smoke test
        # 配信ビルドで描画基盤が成立し、クリアカラー適用・画素密度上限・リサイズでの縦横比追従が
        # 満たされることの実ブラウザ補助確認（Issue #8）。
        run: BASE=http://127.0.0.1:4173 node scripts/rendering-smoke.mjs
      - name: Run camera-trajectory smoke test
        # 検証ビルドで評価器と描画基盤が結線され、全曲長で滑らかに追従し、setCameraPose の適用拒否がなく、
        # 終点でカメラ位置と前方向きが評価器と一致することの実ブラウザ補助確認（Issue #13）。
        run: BASE=http://127.0.0.1:4173 node scripts/camera-trajectory-smoke.mjs
      - name: Run glow-points smoke test
        # 発光点（Issue #10）の受け入れ基準「300個で描画命令が5未満」の実機検証。描画命令の回数は
        # three.js が JavaScript 側で計数するため、GPUの無いソフトウェア描画でも正確に得られる。
        run: BASE=http://127.0.0.1:4173 npm run smoke:glow
      - name: Run butterfly smoke test
        # 蝶造形（Issue #61）の受け入れ検証。派生シェーダが実機でコンパイルされ、単一の InstancedMesh が
        # 1回の描画命令にまとまり、三角形数がジオメトリと描画個体数の積に一致し、活動個体が描かれることを確かめる。
        run: BASE=http://127.0.0.1:4173 npm run smoke:butterfly
      - name: Run layer-composite smoke test
        # 描画層合成（Issue #15）の受け入れ基準「2D層が確実に最前面・z-fightなし」の実機検証。本番と同じ
        # 合成手順で描いた画面の画素を読み戻し、2次元層が最前面（中央が赤）で3次元の色を保持する（外側が緑）
        # ことを確かめる。画素の読み戻しはソフトウェア描画でも正しく得られる。
        run: BASE=http://127.0.0.1:4173 npm run smoke:layer
      - name: Run spatial structural smoke test
        # 空間品質ゲート（Issue #100）の構造スモーク。診断ページが既定起動（反射有効・ブルーム有効）で例外なく
        # 立ち上がり、構造的事実（描画文脈・地形読み込み完了・水面供給元が地形メッシュ・反射有効・ブルーム有効）が
        # 成立することを確かめる。これは配線の確認であり空間品質そのものの保証ではない（品質判定の本体は手元の
        # 実機GPUで動かす）。状態の読み取りはソフトウェア描画でも正しく得られる。
        run: BASE=http://127.0.0.1:4173 npm run smoke:spatial
      - name: Run input smoke test
        # 入力アーキテクチャ（Issue #47）の受け入れ基準の実ブラウザ検証。多指独立・スクロール無効化・
        # タッチとマウスとキーボードの入力同等性を、検証用ビルドの入力診断ページに対して確認する。
        run: BASE=http://127.0.0.1:4173 npm run smoke:input
      - name: Run audio smoke test
        # 操作音エンジン（Issue #52）の受け入れ検証。起動前は無音、信頼された入力で AudioContext が running へ到達、
        # 16音同時で発音中16・非破綻、30音同時で上限24以下に保たれ減衰後に接続中が0へ収束することを確かめる。
        run: BASE=http://127.0.0.1:4173 npm run smoke:audio
      - name: Run credits smoke test
        # クレジット表示（Issue #82）の受け入れ基準の実ブラウザ検証。規定文言が漏れなく表示され、
        # 開閉でき、覆いより上の重なり順に置かれることを、トークン不要の診断経路で確認する。
        run: BASE=http://127.0.0.1:4173 npm run smoke:credits
      - name: Run perf-budget smoke test
        # 性能バジェット自動劣化制御（Issue #18）の段階適用の実ブラウザ検証。Issue #92 で縮退ラダーを5段化
        # （段階1に反射停止を挿入）したため、各段の段階適用と1遷移1レバーが保たれることを確認する。
        run: BASE=http://127.0.0.1:4173 npm run smoke:perf
      - name: Run center-figure smoke test
        # 中心キャラクター常在配置・反射対象制御（Issue #92）の受け入れ検証。VRM が湖の中心へ配置され、
        # 反射既定が「含める」で、反射からの除外を切り替えられることを確認する。
        run: BASE=http://127.0.0.1:4173 npm run smoke:center-figure
      - name: Quality harness (cloud schema checks only)
        # GPUの無いCIでは描画・撮影・フレーム計測を行わず、登録済みのファイル存在とJSONスキーマ
        # だけを検査する（docs/research/08 の1節）。Issue #95時点は検査の登録が無いため登録0件で合格し、
        # Issue #96 が曲プロファイルの検査を登録した時点で実検査が効く。--mode=cloud で入口はクラウド実行
        # だけを動的に読み込むため、ブラウザ起動部品（Playwright）の読み込みに到達しない。
        run: npm run quality:cloud
      - name: Show preview log on failure
        if: failure()
        run: cat preview.log || true
