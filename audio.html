<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>操作音エンジン 受け入れ診断 audio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 10;
        color: #9ffbd0;
        font: 12px/1.4 monospace;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
      #controls {
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #controls button {
        font: 12px/1.2 monospace;
        color: #05060a;
        background: #9ffbd0;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <div id="controls"></div>
    <script type="module" src="/src/audio/diagnostics/main.ts"></script>
  </body>
</html>
