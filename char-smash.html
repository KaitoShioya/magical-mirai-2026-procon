<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>1文字1拍スマッシュ プレビュー char-smash（Issue #23）</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 10;
        color: #9ffbd0;
        font: 12px/1.4 monospace;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
      /* 拍の目印。右上で短く光らせ、スマッシュの山（出現直後）との重なりを目視で確認する。 */
      #beat {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 10;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ffb347;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <div id="beat"></div>
    <script type="module" src="/src/typography/kineticText/diagnostics/charSmash.ts"></script>
  </body>
</html>
