<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <!-- 設計検討用モック（アプリには組み込まない）。案3 水→生命・ひまわり連動 / RANK C 冷たい青 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101a"/><stop offset="1" stop-color="#0a2a3c"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a3c"/><stop offset="1" stop-color="#145a78"/>
    </linearGradient>
    <radialGradient id="miku" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#356a82" stop-opacity="0.7"/><stop offset="1" stop-color="#16384a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#8fb6c8" opacity="0.4">
    <circle cx="120" cy="60" r="1.2"/><circle cx="300" cy="40" r="1"/><circle cx="520" cy="70" r="1.3"/><circle cx="680" cy="50" r="1"/>
  </g>
  <path d="M0,250 Q200,236 400,248 T800,242 L800,300 L0,300 Z" fill="#08202c" opacity="0.85"/>
  <g opacity="0.35">
    <ellipse cx="400" cy="250" rx="68" ry="82" fill="url(#miku)"/>
    <path d="M384,224 q-20,-30 -10,-62 q14,28 18,62 z M416,224 q20,-30 10,-62 q-14,28 -18,62 z" fill="#356a82"/>
    <ellipse cx="400" cy="246" rx="9" ry="20" fill="#356a82"/>
  </g>
  <rect x="0" y="305" width="800" height="145" fill="url(#lake)"/>
  <path d="M0,305 Q200,299 400,305 T800,303" fill="none" stroke="#2f7a9a" stroke-width="2" opacity="0.75"/>
  <g fill="none" stroke="#2f7a9a" opacity="0.5">
    <circle cx="250" cy="355" r="14"/><circle cx="250" cy="355" r="26" opacity="0.5"/><circle cx="560" cy="375" r="10"/>
  </g>
  <!-- ひまわりではなく冷たい芽（暖色はまだ無い） -->
  <g transform="translate(130,330)">
    <path d="M0,8 V-14" stroke="#2f6a5a" stroke-width="3" fill="none"/>
    <path d="M0,-6 q-12,-4 -16,-16 q14,2 16,16 z" fill="#2f7a6a"/>
    <path d="M0,-2 q12,-4 16,-16 q-14,2 -16,16 z" fill="#2f7a6a"/>
  </g>
  <text x="300" y="180" font-size="44" fill="#4a7a90" opacity="0.8" font-weight="bold">疾走</text>
  <text x="430" y="210" font-size="26" fill="#3f6a80" opacity="0.65" font-weight="bold">湖</text>
  <text x="20" y="34" font-size="18" fill="#7aa0b4">SCORE 012,400</text>
  <g transform="translate(728,46)">
    <circle r="28" fill="none" stroke="#3f7a96" stroke-width="2"/>
    <text y="11" font-size="34" fill="#7aa0b4" text-anchor="middle" font-weight="bold">C</text>
  </g>
  <rect x="0" y="420" width="800" height="30" fill="#000" opacity="0.6"/>
  <text x="12" y="440" font-size="13" fill="#cfe6ec">案3 水→生命・ひまわり連動 — RANK C 冷たい青  lake #0a2a3c→#145a78（単色寒色・暖色なし・小さな芽だけ）</text>
</svg>
