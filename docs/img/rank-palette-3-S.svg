<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <!-- 設計検討用モック（アプリには組み込まない）。案3 水→生命・ひまわり連動 / RANK S 黄金のひまわり満ちる -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10283e"/><stop offset="0.6" stop-color="#e08a4a"/><stop offset="1" stop-color="#ffc46a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ec9b8"/><stop offset="1" stop-color="#1a8a9a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="0.95"/><stop offset="1" stop-color="#ff9e5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="miku" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffe0b0" stop-opacity="0.95"/><stop offset="1" stop-color="#ff9e5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="400" cy="195" r="120" fill="url(#sun)" opacity="0.7"/>
  <path d="M0,225 Q200,212 400,222 T800,216 L800,260 L0,260 Z" fill="#7a4a2a" opacity="0.55"/>
  <g>
    <ellipse cx="400" cy="215" rx="80" ry="95" fill="url(#miku)"/>
    <path d="M382,185 q-24,-38 -12,-78 q16,36 22,78 z M418,185 q24,-38 12,-78 q-16,36 -22,78 z" fill="#ffd9a0"/>
    <ellipse cx="400" cy="210" rx="10" ry="26" fill="#ffe8c0"/>
  </g>
  <rect x="0" y="200" width="800" height="250" fill="url(#lake)"/>
  <path d="M0,200 Q200,192 400,200 T800,196" fill="none" stroke="#fff0c0" stroke-width="3" opacity="0.85"/>
  <!-- 黄金の夕映えが水面に映る -->
  <path d="M360,205 L440,205 L470,450 L330,450 Z" fill="#ffd24a" opacity="0.28"/>
  <ellipse cx="400" cy="245" rx="60" ry="16" fill="#ffe8b0" opacity="0.4"/>
  <g fill="none" stroke="#ffe8b0" opacity="0.6">
    <circle cx="250" cy="300" r="16"/><circle cx="250" cy="300" r="32" opacity="0.5"/><circle cx="560" cy="330" r="13"/>
  </g>
  <g fill="#fff0c0" opacity="0.85"><circle cx="180" cy="270" r="2.5"/><circle cx="620" cy="290" r="2"/><circle cx="700" cy="250" r="2.5"/></g>
  <!-- 黄金のひまわり群 -->
  <g transform="translate(130,250) scale(1.2)">
    <ellipse rx="32" ry="32" fill="url(#sun)" opacity="0.6"/>
    <g fill="#ffd24a">
      <ellipse cy="-16" rx="5" ry="12"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(30)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(60)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(90)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(120)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(150)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(180)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(210)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(240)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(270)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(300)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(330)"/>
    </g>
    <circle r="9" fill="#b8602a"/>
  </g>
  <g transform="translate(660,275) scale(0.85)">
    <g fill="#ffc83a">
      <ellipse cy="-16" rx="5" ry="12"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(45)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(90)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(135)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(180)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(225)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(270)"/><ellipse cy="-16" rx="5" ry="12" transform="rotate(315)"/>
    </g>
    <circle r="8" fill="#b8602a"/>
  </g>
  <text x="290" y="175" font-size="52" fill="#fff4d0" font-weight="bold">疾走</text>
  <text x="440" y="210" font-size="30" fill="#ffd24a" font-weight="bold">湖</text>
  <text x="20" y="34" font-size="18" fill="#fff0c0">SCORE 248,900</text>
  <g transform="translate(728,46)">
    <circle r="30" fill="url(#sun)" opacity="0.7"/>
    <circle r="28" fill="none" stroke="#fff4d0" stroke-width="2.5"/>
    <text y="12" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>
  </g>
  <rect x="0" y="420" width="800" height="30" fill="#000" opacity="0.55"/>
  <text x="12" y="440" font-size="13" fill="#fff4d0">案3 水→生命・ひまわり連動 — RANK S  青い湖 #1ec9b8 + 黄金 #ffd24a + 夕映え #ff9e5a（黄金のひまわりと光が満ちる）</text>
</svg>
