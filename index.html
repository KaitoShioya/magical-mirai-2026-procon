<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マジカルミライ2026 プロコン リリックアプリ</title>
  </head>
  <body>
    <!-- ローディングオーバーレイ -->
    <div id="loading">
      <div id="loading-spinner"></div>
      <div id="loading-text">TextAlive を初期化中...</div>
    </div>

    <!-- ヘッダー: 曲選択 -->
    <header id="header">
      <select id="song-select" title="曲を選択"></select>
      <span id="song-title"></span>
    </header>

    <!-- メインステージ: 歌詞表示エリア -->
    <main id="stage">
      <div id="lyric-phrase" class="hidden"></div>
      <div id="lyric-word"></div>
    </main>

    <!-- TextAlive が操作する audio 要素 -->
    <audio id="audio-media"></audio>

    <!-- フッター: 再生コントロール -->
    <footer id="footer">
      <div id="controls">
        <button id="btn-play" disabled>▶ 再生</button>
        <input id="seek" type="range" min="0" max="1000" value="0" step="100" />
        <span id="time-display">0:00 / 0:00</span>
      </div>
      <div id="status">TextAlive を読み込み中...</div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
