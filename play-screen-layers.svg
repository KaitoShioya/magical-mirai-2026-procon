<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif">
  <defs>
    <!-- 空: 夜のグラデーション -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d24"/>
      <stop offset="70%" stop-color="#0c2440"/>
      <stop offset="100%" stop-color="#10405a"/>
    </linearGradient>
    <!-- 湖: まだ満ちていない上部(暗) -->
    <linearGradient id="lakeEmpty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2a3c"/>
      <stop offset="100%" stop-color="#0d3550"/>
    </linearGradient>
    <!-- 湖: 満ちた部分(碧のグラデーション = 成果物が育っている) -->
    <linearGradient id="lakeFilled" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e6b7e"/>
      <stop offset="45%" stop-color="#15a3a8"/>
      <stop offset="100%" stop-color="#1ec9b8"/>
    </linearGradient>
    <radialGradient id="mikuGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9ff7ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3ad9d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ad9d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="noteGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8fff4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2ee6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ 下層: 湖の世界 ============ -->
  <rect width="1280" height="400" fill="url(#sky)"/>
  <!-- 星 -->
  <g fill="#cfe9ff">
    <circle cx="140" cy="70" r="1.6" opacity="0.8"/><circle cx="320" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="540" cy="90" r="1.4" opacity="0.7"/><circle cx="880" cy="55" r="1.6" opacity="0.8"/>
    <circle cx="1050" cy="110" r="1.2" opacity="0.6"/><circle cx="1180" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="720" cy="35" r="1.1" opacity="0.5"/><circle cx="430" cy="130" r="1.1" opacity="0.5"/>
  </g>
  <!-- 対岸のシルエット -->
  <path d="M0,400 L0,372 Q160,352 330,368 Q470,380 620,362 Q800,344 950,366 Q1120,384 1280,366 L1280,400 Z" fill="#061826"/>

  <!-- 湖面(未充填領域) -->
  <rect y="400" width="1280" height="320" fill="url(#lakeEmpty)"/>
  <!-- 満ちた湖面(下から色のグラデーションで満ちていく = 満たし具合43%) -->
  <rect y="585" width="1280" height="135" fill="url(#lakeFilled)" opacity="0.92"/>
  <!-- 満ち際のゆらぎライン -->
  <path d="M0,585 Q120,578 240,585 Q380,593 520,584 Q660,576 800,586 Q950,595 1090,584 Q1190,578 1280,585"
        fill="none" stroke="#5af0dc" stroke-width="3" opacity="0.7"/>

  <!-- 湖上のミク(湖畔のライブ: 距離固定・画面の約1/3スケール) -->
  <ellipse cx="640" cy="430" rx="280" ry="110" fill="url(#mikuGlow)"/>
  <g transform="translate(640,440) scale(3.8)">
    <path d="M0,-26 a9,9 0 1,1 0.1,0 M-4,-18 L-7,8 Q0,12 7,8 L4,-18 Z" fill="#0c3344"/>
    <path d="M-8,-22 Q-22,2 -16,26 M8,-22 Q22,2 16,26" stroke="#0c3344" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="30" rx="34" ry="5" fill="#5af0dc" opacity="0.5"/>
  </g>

  <!-- 湖面の鏡像(ミクの光) -->
  <ellipse cx="640" cy="600" rx="130" ry="26" fill="#3ad9d0" opacity="0.25"/>
  <ellipse cx="640" cy="640" rx="90" ry="16" fill="#3ad9d0" opacity="0.16"/>

  <!-- ============ 中層A: 音符・波紋(ハメのフィードバック) ============ -->
  <!-- 波紋: 干渉する同心円 -->
  <g fill="none" stroke="#7df5e2">
    <circle cx="350" cy="555" r="26" stroke-width="2.5" opacity="0.85"/>
    <circle cx="350" cy="555" r="48" stroke-width="1.8" opacity="0.55"/>
    <circle cx="350" cy="555" r="72" stroke-width="1.2" opacity="0.3"/>
    <circle cx="450" cy="572" r="34" stroke-width="2" opacity="0.6"/>
    <circle cx="450" cy="572" r="58" stroke-width="1.3" opacity="0.35"/>
    <!-- 干渉の交差部を強調 -->
    <path d="M398,540 Q412,560 398,584" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="980" cy="540" r="20" stroke-width="2.4" opacity="0.9"/>
    <circle cx="980" cy="540" r="40" stroke-width="1.6" opacity="0.5"/>
  </g>
  <!-- 落下中の音符(軌跡つき) -->
  <g>
    <path d="M980,300 Q975,380 980,505" stroke="#2ee6c8" stroke-width="2" opacity="0.35" fill="none" stroke-dasharray="2 7"/>
    <circle cx="980" cy="505" r="30" fill="url(#noteGlow)"/>
    <text x="980" y="516" font-size="34" text-anchor="middle" fill="#eafffb">♪</text>
    <circle cx="350" cy="520" r="26" fill="url(#noteGlow)" opacity="0.8"/>
    <text x="350" y="530" font-size="28" text-anchor="middle" fill="#eafffb" opacity="0.85">♪</text>
    <!-- 溶けかけの音符(湖に吸収され、粒子化) -->
    <text x="452" y="580" font-size="24" text-anchor="middle" fill="#bafff2" opacity="0.45">♪</text>
    <g fill="#bafff2">
      <circle cx="466" cy="590" r="2" opacity="0.5"/><circle cx="441" cy="596" r="1.6" opacity="0.4"/>
      <circle cx="458" cy="602" r="1.3" opacity="0.3"/>
    </g>
  </g>

  <!-- ============ 中層B: 歌詞テキスト演出(疾走の主役) ============ -->
  <g transform="translate(640,225) rotate(-3)">
    <text x="0" y="0" text-anchor="middle" font-size="86" font-weight="900" fill="#ffffff"
          stroke="#0a4a5c" stroke-width="10" paint-order="stroke" letter-spacing="6">アップ＆ダウン</text>
  </g>
  <g transform="translate(648,295) rotate(-3)">
    <text x="0" y="0" text-anchor="middle" font-size="40" font-weight="800" fill="#5af0dc"
          stroke="#06283a" stroke-width="6" paint-order="stroke" letter-spacing="10" opacity="0.95">スクランブルランブル</text>
  </g>
  <!-- 発声中の文字の強調(エコー残像) -->
  <text x="408" y="232" text-anchor="middle" font-size="86" font-weight="900" fill="#2ee6c8" opacity="0.28" transform="rotate(-3 408 225)">ア</text>

  <!-- ============ 上層: UI(四隅・最小限) ============ -->
  <g font-weight="700">
    <text x="36" y="52" font-size="26" fill="#dffcf6" letter-spacing="2">SCORE 124,500</text>
    <text x="1244" y="52" font-size="26" fill="#dffcf6" text-anchor="end" letter-spacing="2">COMBO x48</text>
    <!-- 投下リソースゲージ(左下) -->
    <text x="36" y="654" font-size="16" fill="#9fe8db" letter-spacing="2">RESOURCE</text>
    <rect x="36" y="664" width="300" height="14" rx="7" fill="#0a3344" stroke="#2ee6c8" stroke-width="1.5"/>
    <rect x="36" y="664" width="195" height="14" rx="7" fill="#2ee6c8" opacity="0.85"/>
    <!-- 満たし具合(右下) -->
    <text x="1244" y="678" font-size="16" fill="#9fe8db" text-anchor="end" letter-spacing="2">LAKE 43%</text>
  </g>

  <!-- ============ 注釈(レイヤー名ラベル / 本番には存在しない) ============ -->
  <g font-size="15" font-weight="700">
    <g>
      <rect x="1020" y="96" width="236" height="26" rx="4" fill="#000000" opacity="0.55"/>
      <text x="1032" y="114" fill="#ffd966">上層: UI(四隅・最小限)</text>
      <path d="M1130,122 L1190,58" stroke="#ffd966" stroke-width="1.2" opacity="0.7" fill="none"/>
    </g>
    <g>
      <rect x="60" y="150" width="262" height="26" rx="4" fill="#000000" opacity="0.55"/>
      <text x="72" y="168" fill="#ffd966">中層B: 歌詞タイポ(疾走の主役)</text>
      <path d="M322,163 L420,205" stroke="#ffd966" stroke-width="1.2" opacity="0.7" fill="none"/>
    </g>
    <g>
      <rect x="60" y="470" width="290" height="26" rx="4" fill="#000000" opacity="0.55"/>
      <text x="72" y="488" fill="#ffd966">中層A: 音符・波紋(ハメ→溶けて積分)</text>
      <path d="M330,496 L342,532" stroke="#ffd966" stroke-width="1.2" opacity="0.7" fill="none"/>
    </g>
    <g>
      <rect x="700" y="640" width="420" height="26" rx="4" fill="#000000" opacity="0.55"/>
      <text x="712" y="658" fill="#ffd966">下層: 湖の世界(満ち具合43% = 成果物が育つ過程が見える)</text>
      <path d="M700,653 L600,628" stroke="#ffd966" stroke-width="1.2" opacity="0.7" fill="none"/>
    </g>
    <g>
      <rect x="700" y="330" width="248" height="26" rx="4" fill="#000000" opacity="0.55"/>
      <text x="712" y="348" fill="#ffd966">湖畔のライブ: ミク(距離固定・約1/3スケール)</text>
      <path d="M700,343 L672,360" stroke="#ffd966" stroke-width="1.2" opacity="0.7" fill="none"/>
    </g>
  </g>
</svg>
