<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>自己ベスト履歴 受け入れ診断 score-history</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05060a;
        color: #d7e6ff;
        font: 14px/1.6 system-ui, sans-serif;
      }
      #panel {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px;
      }
      #controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      #controls button {
        font: inherit;
        color: #05060a;
        background: #9ffbd0;
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #hud {
        color: #9ffbd0;
        font: 12px/1.4 monospace;
        margin-bottom: 12px;
        white-space: pre;
      }
      #view {
        border: 1px solid rgba(159, 251, 208, 0.25);
        border-radius: 8px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.3);
      }
      .score-history__empty {
        margin: 0;
        color: #7f93b3;
      }
      .score-history__best {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 16px;
      }
      .score-history__best-label {
        color: #9ffbd0;
        font-size: 12px;
      }
      .score-history__best-score {
        font-size: 32px;
        font-weight: 700;
      }
      .score-history__chart {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 160px;
      }
      .score-history__bar {
        flex: 1 1 0;
        min-width: 4px;
        background: #3f6fb0;
        border-radius: 3px 3px 0 0;
      }
      .score-history__bar--best {
        background: #ffd166;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="controls">
        <button id="add" type="button">記録を追加</button>
        <button id="reset" type="button">初期化</button>
      </div>
      <div id="hud">loading…</div>
      <div id="view"></div>
    </div>
    <script type="module" src="/src/ui/diagnostics/scoreHistory/main.ts"></script>
  </body>
</html>
