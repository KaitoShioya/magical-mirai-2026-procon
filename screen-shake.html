<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>画面拡大・減衰揺れ 受け入れ診断 screen-shake</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      /* 拡大時にcanvasがはみ出すため切り取り、拡大の中心を画面中央へ固定する。 */
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        transform-origin: 50% 50%;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 10;
        color: #9ffbd0;
        font: 12px/1.4 monospace;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <script type="module" src="/src/rendering/diagnostics/screenShake/main.ts"></script>
  </body>
</html>
